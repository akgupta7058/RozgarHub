<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Deep Blue Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Glow border -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#3B82F6" stroke-width="4" stroke-opacity="0.3" />

  <!-- Center Orange & Navy Badge -->
  <g filter="url(#drop)">
    <!-- Orange Outer Ring -->
    <circle cx="256" cy="245" r="170" fill="url(#badgeGrad)" stroke="#FED7AA" stroke-width="6" />
    
    <!-- Dark Navy Inner Core -->
    <circle cx="256" cy="245" r="145" fill="#172554" />
    
    <!-- 'RH' Typography -->
    <!-- R -->
    <path d="M 160 170 L 225 170 C 255 170 275 188 275 218 C 275 248 255 264 225 266 L 275 320 L 235 320 L 195 272 L 190 272 L 190 320 L 160 320 Z M 190 198 L 190 244 L 220 244 C 238 244 246 235 246 221 C 246 207 238 198 220 198 Z" fill="#FFFFFF" />

    <!-- H -->
    <path d="M 295 170 L 325 170 L 325 230 L 370 230 L 370 170 L 400 170 L 400 320 L 370 320 L 370 258 L 325 258 L 325 320 L 295 320 Z" fill="#FFFFFF" />

    <!-- Orange Accent Pill Under RH -->
    <rect x="230" y="345" width="52" height="14" rx="7" fill="#F97316" />
  </g>

  <!-- Tagline Text at Bottom -->
  <text x="256" y="455" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">
    ROZGAR<tspan fill="#FB923C">HUB</tspan>
  </text>
  <text x="256" y="480" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#93C5FD" text-anchor="middle" letter-spacing="1">
    SAHI KAAM • SAHI DAAM
  </text>
</svg>
