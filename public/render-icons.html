<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; background: #1E3A8A; overflow: hidden; }
    #normal { width: 100%; height: 100%; object-fit: contain; }
    #maskable { width: 78%; height: 78%; object-fit: contain; }
  </style>
</head>
<body>
  <img id="icon" src="/icon.svg" />
  <script>
    const params = new URLSearchParams(window.location.search);
    const img = document.getElementById('icon');
    if (params.get('mode') === 'maskable') {
      img.id = 'maskable';
      document.body.style.background = '#1E3A8A';
    } else {
      img.id = 'normal';
      document.body.style.background = 'transparent';
    }
  </script>
</body>
</html>
